motor.ayuda.sem.verde: "no signal off: normal session."
motor.ayuda.sem.amarillo_t: "Yellow"
motor.ayuda.sem.amarillo: "one signal off: easy version of the session."
motor.ayuda.sem.rojo_t: "Red"
motor.ayuda.sem.rojo: "two or more signals off, or low HRV: rest or a light walk. Two red days in a row: repeat the week."
motor.ayuda.sem.sin_t: "No data"
motor.ayuda.sem.sin: "HRV, resting HR and sleep with no data from last night: normal session; go by how you feel."
motor.ayuda.ses.titulo: "Your sessions"
motor.ayuda.ses.z2: "easy runs in {z2}: you can chat while you run."
motor.ayuda.ses.z2_techo: " If you go over the ceiling, walk until you come back down."
motor.ayuda.ses.z2_txt: "Z2 ({a}–{b} bpm)"
motor.ayuda.ses.tc_t: "Run/walk"
motor.ayuda.ses.tc: "you alternate running and walking (you start with run {a}'/walk {b}' and reach run {c}'/walk {d}'). When you feel good you can move up to the next step."
motor.ayuda.ses.var_t: "Varied"
motor.ayuda.ses.var: "one of your sessions changes pace within your zone; it rotates between {lista}. In deload weeks everything is continuous."
motor.ayuda.ses.cal_t: "Quality"
motor.ayuda.ses.cal: "one session per week with harder effort; your types: {lista}. Going over the target zone in that session is part of the idea."
motor.ayuda.ses.larga_t: "Long run"
motor.ayuda.ses.larga: "the longest of the week, at a comfortable pace; it goes on Saturday or Sunday."
motor.ayuda.ses.larga_pierna: " If you train legs on {dias}, avoid the long run the next day."
motor.ayuda.ses.picos_t: "Z3 peaks"
motor.ayuda.ses.picos: "in some weeks, 1' in Z3 is optional within the session. If you do them they count as done; if not, no problem."
motor.ayuda.ses.desc_t: "Deload weeks"
motor.ayuda.ses.desc: "weeks {lista} lower the load"
motor.ayuda.ses.desc_cont: ": everything continuous in Z2."
motor.ayuda.ses.desc_punto: "."
motor.ayuda.ses.generico_cal: "Quality"
motor.ayuda.ses.generico_var: "Varied"
motor.ayuda.ses.asig_t: "Automatic assignment"
motor.ayuda.ses.asig: "a Saturday or Sunday run lasting at least {done} % of the long run counts as the long run; the others fill {otras} in order. If you do more, the extras aren't assigned."
motor.ayuda.ses.otras: "your other sessions"
motor.ayuda.ses.hecha_t: "Done or incomplete"
motor.ayuda.ses.hecha: "done if it lasted at least {done} % of what was planned (or of the easy version if that day was yellow or red); if shorter, incomplete."
motor.ayuda.ses.bien_t: "Did I do it right?"
motor.ayuda.ses.bien: "the minutes above the Z2 ceiling (zones 3 to 5) should be {x}' or less"
motor.ayuda.ses.bien_picos: "; sessions with Z3 peaks allow 2' more"
motor.ayuda.ses.bien_pvr: ". Also, plan vs actual by zone: the minutes you did in each plan zone against those planned; at {done} % it counts as met (HR takes time to rise)."
motor.ayuda.ses.tiempo_t: "Time"
motor.ayuda.ses.tiempo: "it is clock time"
motor.ayuda.ses.tiempo_cam: ", walks included. Run and walk come from the segments Garmin detects; the jogging pace doesn't count the walk."
motor.ayuda.ses.tiempo_punto: "."
motor.ayuda.ses.n: "Your plan has {n} sessions per week"
motor.ayuda.ses.n1: "Your plan has 1 session per week"
motor.ayuda.pru.titulo: "The last week's test"
motor.ayuda.pru.fc_fija_n: "30 min at fixed HR"
motor.ayuda.pru.fc_fija: "30 min at fixed HR ({fc_ref} bpm, half of your Z2) on a flat route and with a watch alert; the pace of those 30 min counts (and the km)."
motor.ayuda.pru.trote_continuo_n: "continuous jog"
motor.ayuda.pru.trote_continuo: "30 min jogging without walking, in Z2; the % of jogging in the run counts."
motor.ayuda.pru.5k_n: "5 km flat out"
motor.ayuda.pru.5k: "5 km flat out; your time counts."
motor.ayuda.pru.base_fc_fija: "the pace of your weeks 1–2"
motor.ayuda.pru.base_trote_continuo: "the % of jogging of your weeks 1–2"
motor.ayuda.pru.base_5k: "your best 5 km from before the plan"
motor.ayuda.pru.p1: "In the last week of your plan (week {n}) one session is replaced by a test to measure your improvement: {como}"
motor.ayuda.pru.previa: "your previous test"
motor.ayuda.pru.p2_a: "It is compared with {x}. When the plan ends, Today shows the result and tells you to {ir} for the next block."
motor.ayuda.pru.p2_b_base: "{base} and, later, with your previous test"
motor.ayuda.pru.ir_web: "go to Settings"
motor.ayuda.pru.ir_cli: "run /ajustar"
motor.ayuda.mej.titulo: "How we measure your improvement"
motor.ayuda.mej.ritmo_t: "Pace at {fc} bpm"
motor.ayuda.mej.ritmo: "we bring the pace of each outdoor run to {fc} bpm (half of your Z2): pace × the HR you had ÷ {fc}. It is your aerobic efficiency: if you improve, at the same HR you go faster. Only runs whose jog fell in Z2 count; no races or treadmill"
motor.ayuda.mej.ritmo_cal: ", nor quality sessions"
motor.ayuda.mej.ritmo_fin: ". Heat and fatigue raise HR: look at the trend, not a single run. In Progress you see the average of your last 4 valid runs against your weeks 1–2."
motor.ayuda.mej.deriva_t: "Cardiac drift"
motor.ayuda.mej.deriva: "in runs of 40 min or more, with almost no walking, at an even pace and with at least 80 % of the jog in Z2, we compare speed ÷ HR of the first half against the second (without the first 10 min). Less than 5 % drop is a good aerobic base; more, you still need base."
motor.ayuda.mej.trote_t: "% jogging"
motor.ayuda.mej.trote: "what part of the run was jogging: if it rises, your body can already jog longer without stopping."
motor.ayuda.mej.esfuerzo_t: "Effort"
motor.ayuda.mej.esfuerzo: "calculated from your HR, from 1 to 10 (Z2 = 3, Z3 = 5.5, Z4 = 7.5, Z5 = 9.5): the average of the hardest half of the session. Load = effort × minutes; strength work with low HR gives little load. The RPE you enter on the watch is saved separately."
motor.ayuda.zon.titulo: "Your zones and the 80/20"
motor.ayuda.zon.p1: "The zones use Karvonen (% of your HR reserve) with your max HR of {max} bpm. They adjust on their own with your resting HR."
motor.ayuda.zon.p2: "The 80/20: ideally at least 80 % of your time in zones is easy (Z1–Z2), as little as possible in Z3 and the rest hard (Z4–Z5). It includes {lista}. It is only a reference: it doesn't change your plan."
motor.ayuda.zon.Z1: "recovery and warm-up"
motor.ayuda.zon.Z2: "your aerobic base: the bulk of your runs"
motor.ayuda.zon.Z3: "medium, “the limbo”"
motor.ayuda.zon.Z4: "hard"
motor.ayuda.zon.Z5: "maximum"
motor.ayuda.zon.fila: "{a}–{b} bpm · {sig}"

