priv.titulo_pagina: "Privacy notice · Ahí la Llevas"
priv.titulo: "Privacy notice"
priv.version: "Version {v} · Ahí la Llevas"
priv.h0: "Summary"
priv.resumen: "Ahí la Llevas stores your Garmin training and health data to show you your plan and your progress. Only friends join, by invitation. We don't sell or transfer your data. You can ask to see, correct, download or delete it whenever you want."
priv.h1: "1. Who is responsible"
priv.resp: "The data controller is Pedro, administrator of Ahí la Llevas (a personal, non-profit project). To exercise your rights write to {correo}."
priv.correo_invito: "the email Pedro invited you with"
priv.h2: "2. What data we process"
priv.d1: "<strong>Account:</strong> your email, your nickname and your GitHub username."
priv.d2: "<strong>Training:</strong> date, duration, distance, pace and heart rate per second of your activities; RPE and feel.\n  We do <em>not</em> store activity names, maps, location (GPS) or Garmin identifiers."
priv.d3: "<strong>Sensitive health data:</strong> resting and exercise heart rate, heart rate variability (HRV), sleep and body composition (InBody). We process them only with your <strong>express consent</strong>."
priv.d4: "<strong>Your decisions:</strong> your settings, your plan and the change history (who made them and when)."
priv.h3: "3. What we use it for (purposes)"
priv.f1: "Show you your dashboard, your plan and your progress."
priv.f2: "Share it with your coach <strong>only if you give them access</strong>, and remove it whenever you want."
priv.f3: "Notify you if your repository stopped sending data."
priv.f4: "We don't use your data for advertising, commercial profiling or any other purpose."
priv.h4: "4. Who else takes part (processors and sources)"
priv.e1: "<strong>Google Cloud</strong> (Cloud Run and Cloud Storage): hosts the application and the backups."
priv.e2: "<strong>Neon:</strong> stores the database."
priv.e3: "<strong>Resend:</strong> sends the email with your sign-in code."
priv.e4: "<strong>GitHub:</strong> runs, in your own account, the program that downloads your Garmin data."
priv.e5: "<strong>Cloudflare:</strong> manages the domain name."
priv.e6: "<strong>Garmin:</strong> is the source of your data (Garmin data). Your Garmin key stays in your GitHub and we never receive it."
priv.e7: "There are no transfers to third parties and no sale of data."
priv.h5: "5. Your rights (ARCO)"
priv.r: "You can <strong>access, rectify, cancel or object to</strong> the processing of your data, and withdraw your consent.\nWrite to the controller's email. From <a href=\"/privacidad/mis-datos\">My data</a> you can <em>download your data</em> and\n<em>delete your account</em>. Deleting your account deletes your data from the web; your GitHub repo is yours."
priv.h6: "6. Changes to this notice"
priv.c: "If it changes, we show it to you and ask you to accept the new version. The current version is shown above."
priv.h7: "7. Important"
priv.i: "<strong>This is not medical advice.</strong> If something hurts, stop. Consult a health professional if in doubt.\nGarmin data."
bv.titulo_pagina: "Welcome · Ahí la Llevas"
bv.titulo: "Let's build your plan"
bv.paso: "Step {n} of {total}"
bv.p1_t: "Your privacy first"
bv.p1_a: "To build your plan we store data from your Garmin: <strong>heart rate, variability (HRV), sleep and body composition</strong>. These are <strong>sensitive personal data</strong> and we need your express consent."
bv.p1_l1: "We use it only to show you your dashboard and your plan (and share it with your coach if you turn that on)."
bv.p1_l2: "We don't sell or transfer it. You can download or delete it whenever you want."
bv.p1_l3: "Your Garmin key <strong>never</strong> reaches us: it stays in your GitHub account."
bv.p1_l4: "This is not medical advice. If something hurts, stop."
bv.p1_leer: "<a href=\"/privacidad\" target=\"_blank\" rel=\"noopener\">Read the full privacy notice</a> (version {v})."
bv.acepto: "I read the privacy notice and <strong>expressly accept</strong> the processing of my sensitive health data for these purposes."
bv.continuar: "Continue"
bv.p2_t: "What's your GitHub username?"
bv.p2_a: "Your Garmin data travels through a private copy that lives in <strong>your</strong> GitHub account; that way your key never leaves it. It's free."
bv.p2_campo: "GitHub username"
bv.p2_ayuda: "It's what appears in github.com/your-username."
bv.p2_sin: "No account? <a href=\"https://github.com/signup\" target=\"_blank\" rel=\"noopener\">Create a free one</a>\n(we use it only to run your copy of the program that downloads your data)."
bv.p3_t: "Create your copy on GitHub"
bv.p3_a: "A <strong>private</strong> copy of the program that downloads your Garmin data is created. Keep the name GitHub suggests."
bv.p3_boton: "Create my copy on GitHub"
bv.p3_n: "On GitHub tap \"Create repository from template\". Then come back here."
bv.otro_nombre: "If you gave it another name, open your repo on GitHub and carry on the same way."
bv.p3_ya: "I created it"
bv.p4_t: "Put your Garmin key in your repo"
bv.p4_aviso: "<strong>Your key stays in your GitHub; we never ask for it here.</strong> Don't type it on this page."
bv.p4_l1: "Go to <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">your Garmin Connect page</a>, tap <em>Create Key</em> and choose the longest expiration. Copy the key (it's shown only once)."
bv.p4_l2: "Open <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">your repo's secrets form</a> ({repo}; if you gave it another name, open your repo on GitHub and carry on the same way). In <em>Name</em> type:"
bv.p4_l3: "In <em>Secret</em> paste your key and tap <em>Add secret</em>."
comun.atras: "Back"
bv.p4_ya: "I put it in"
bv.p5_t: "Turn it on"
bv.p5_l1: "Open <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">your repo's Actions tab</a> and, if GitHub asks, tap <em>I understand my workflows, go ahead and enable them</em>."
bv.p5_l2: "Choose the <em>Deploy</em> workflow on the left and tap <em>Run workflow</em> (the green button)."
bv.p5_n: "It runs on its own 3 times a day; this first manual run brings in your history."
bv.p5_ya: "I ran it"
bv.p6_t: "Check that this repo is yours"
bv.p6_l1: "Open <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">your repo's latest run</a> (Actions tab). If there is none, tap <em>Run workflow</em> on the <em>Deploy</em> workflow and wait a couple of minutes."
bv.p6_l2: "Open that run: below, in <em>Summary</em>, it says \"Your code for Ahí la Llevas\". Only people with access to your private repo can see it."
bv.p6_l3: "Type the 6-digit code here:"
bv.p6_codigo: "Code"
bv.p6_vincular: "Link my repo"
bv.p6_n: "The code expires in 1 hour and you have 5 attempts; if it fails, run \"Run workflow\" again for a new one."
bv.p6b_t: "Repo linked ✔ — now your data"
bv.p6b_a: "The run that generated the code doesn't save data. Run the workflow one more time:"
bv.p6b_boton: "Run workflow in my repo"
bv.p6b_espera: "They haven't arrived yet. It takes a minute or two after \"Run workflow\"."
bv.p6b_listo: "Your data has arrived ✔"
bv.p6b_armar: "Build my plan"
bv.p6b_n: "If 5 minutes go by, check that the workflow didn't fail (it's almost always the key: pasted correctly and named <code>PERSONAL_API_KEY</code>)."
