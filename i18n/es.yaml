bv.p1_l3: "Tu key de Garmin <strong>nunca</strong> llega aquí: se queda en tu cuenta de GitHub."
bv.p1_l4: "Esto no es consejo médico. Si algo duele, para."
bv.p1_leer: "<a href=\"/privacidad\" target=\"_blank\" rel=\"noopener\">Leer el aviso de privacidad completo</a> (versión {v})."
bv.acepto: "Leí el aviso de privacidad y <strong>acepto expresamente</strong> el tratamiento de mis datos sensibles de salud para estas finalidades."
bv.continuar: "Continuar"
bv.p2_t: "¿Cuál es tu usuario de GitHub?"
bv.p2_a: "Tus datos de Garmin viajan por una copia privada que vive en <strong>tu</strong> cuenta de GitHub; así tu key\nnunca sale de ahí. Es gratis."
bv.p2_campo: "Usuario de GitHub"
bv.p2_ayuda: "Es lo que aparece en github.com/tu-usuario."
bv.p2_sin: "¿No tienes cuenta? <a href=\"https://github.com/signup\" target=\"_blank\" rel=\"noopener\">Crea una gratis</a>\n(la usamos solo para correr tu copia del programa que baja tus datos)."
bv.p3_t: "Crea tu copia en GitHub"
bv.p3_a: "Se crea una copia <strong>privada</strong> del programa que baja tus datos de Garmin. Deja el nombre que te sugiere GitHub."
bv.p3_boton: "Crear mi copia en GitHub"
bv.p3_n: "En GitHub toca «Create repository from template». Luego regresa aquí."
bv.otro_nombre: "Si le pusiste otro nombre, abre tu repo en GitHub y sigue igual."
bv.p3_ya: "Ya la creé"
bv.p4_t: "Pon tu key de Garmin en tu repo"
bv.p4_aviso: "<strong>Tu key se queda en tu GitHub; aquí no la pedimos nunca.</strong> No la escribas en esta página."
bv.p4_l1: "Entra a <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">tu página de Garmin Connect</a>, toca <em>Create Key</em> y elige la expiración más larga. Copia la key (solo se muestra una vez)."
bv.p4_l2: "Abre <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">el formulario de secretos de tu repo</a> ({repo}; si le pusiste otro nombre, abre tu repo en GitHub y sigue igual). En <em>Name</em> escribe:"
bv.p4_l3: "En <em>Secret</em> pega tu key y toca <em>Add secret</em>."
comun.atras: "Atrás"
bv.p4_ya: "Ya la puse"
bv.p5_t: "Actívalo"
bv.p5_l1: "Abre <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">la pestaña Actions de tu repo</a> y, si GitHub te lo pide, toca <em>I understand my workflows, go ahead and enable them</em>."
bv.p5_l2: "Elige el flujo <em>Deploy</em> a la izquierda y toca <em>Run workflow</em> (el botón verde)."
bv.p5_n: "Corre solo 3 veces al día; este primer disparo manual trae tu historial."
bv.p5_ya: "Ya lo corrí"
bv.p6_t: "Comprueba que ese repo es tuyo"
bv.p6_l1: "Abre <a href=\"{liga}\" target=\"_blank\" rel=\"noopener\">la última corrida de tu repo</a> (pestaña Actions). Si no hay ninguna, toca <em>Run workflow</em> en el flujo <em>Deploy</em> y espera un par de minutos."
bv.p6_l2: "Entra a esa corrida: abajo, en <em>Summary</em>, dice «Tu código para Ahí la Llevas». Solo lo ven quienes tienen acceso a tu repo privado."
bv.p6_l3: "Escribe aquí el código de 6 dígitos:"
bv.p6_codigo: "Código"
bv.p6_vincular: "Vincular mi repo"
bv.p6_n: "El código vence en 1 hora y tienes 5 intentos; si falla, corre «Run workflow» otra vez para uno nuevo."
bv.p6b_t: "Repo vinculado ✔ — ahora tus datos"
bv.p6b_a: "La corrida que generó el código no guarda datos. Corre el flujo una vez más:"
bv.p6b_boton: "Run workflow en mi repo"
bv.p6b_espera: "Todavía no llegan. Tarda uno o dos minutos después de «Run workflow»."
bv.p6b_listo: "Ya llegaron tus datos ✔"
bv.p6b_armar: "Armar mi plan"
bv.p6b_n: "Si pasan 5 minutos, revisa que el flujo no haya fallado (casi siempre es la key: bien pegada y con el nombre <code>PERSONAL_API_KEY</code>)."
bv.p7_t: "Tu plan"
bv.p7_a: "Las mismas preguntas de siempre; todo se puede cambiar después en Ajustes."
