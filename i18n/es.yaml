priv.titulo_pagina: "Aviso de privacidad · Ahí la Llevas"
priv.titulo: "Aviso de privacidad"
priv.version: "Versión {v} · Ahí la Llevas"
priv.h0: "Resumen"
priv.resumen: "Ahí la Llevas guarda tus datos de entrenamiento y salud de Garmin para mostrarte tu plan y tu progreso. Solo entran amigos por invitación. No vendemos tus datos ni los transferimos. Puedes pedir verlos, corregirlos, descargarlos o borrarlos cuando quieras."
priv.h1: "1. Quién es el responsable"
priv.resp: "El responsable del tratamiento es Pedro, administrador de Ahí la Llevas (proyecto personal, sin fines de lucro). Para ejercer tus derechos escribe a {correo}."
priv.correo_invito: "el correo con el que Pedro te invitó"
priv.h2: "2. Qué datos tratamos"
priv.d1: "<strong>Cuenta:</strong> tu correo, tu apodo y tu usuario de GitHub."
priv.d2: "<strong>Entrenamiento:</strong> fecha, duración, distancia, ritmo y pulso por segundo de tus actividades; RPE y sensación.\n  <em>No</em> guardamos nombres de actividades, mapas, ubicación (GPS) ni identificadores de Garmin."
priv.d3: "<strong>Datos sensibles de salud:</strong> frecuencia cardiaca en reposo y durante el ejercicio, variabilidad de la\n  frecuencia cardiaca (HRV), sueño y composición corporal (InBody). Los tratamos solo con tu <strong>consentimiento expreso</strong>."
priv.d4: "<strong>Tus decisiones:</strong> tus ajustes, tu plan y el historial de cambios (quién los hizo y cuándo)."
priv.h3: "3. Para qué los usamos (finalidades)"
priv.f1: "Mostrarte tu dashboard, tu plan y tu progreso."
priv.f2: "Compartirlos con tu coach <strong>solo si tú le das acceso</strong>, y quitárselo cuando quieras."
priv.f3: "Avisarte si tu repositorio dejó de mandar datos."
priv.f4: "No usamos tus datos para publicidad, perfiles comerciales ni ninguna otra finalidad."
priv.h4: "4. Quién más participa (encargados y fuentes)"
priv.e1: "<strong>Google Cloud</strong> (Cloud Run y Cloud Storage): aloja la aplicación y los respaldos."
priv.e2: "<strong>Neon:</strong> guarda la base de datos."
priv.e3: "<strong>Resend:</strong> manda el correo con tu liga de entrada."
priv.e4: "<strong>GitHub:</strong> ejecuta, en tu propia cuenta, el programa que baja tus datos de Garmin."
priv.e5: "<strong>Cloudflare:</strong> administra el nombre de dominio."
priv.e6: "<strong>Garmin:</strong> es la fuente de tus datos (Datos de Garmin). Tu key de Garmin se queda en tu GitHub y nunca la recibimos."
priv.e7: "No hay transferencias a terceros ni venta de datos."
priv.h5: "5. Tus derechos (ARCO)"
priv.r: "Puedes <strong>acceder, rectificar, cancelar u oponerte</strong> al tratamiento de tus datos, y revocar tu consentimiento.\nEscribe al correo del responsable. Desde <a href=\"/privacidad/mis-datos\">Mis datos</a> puedes <em>descargar tus datos</em> y\n<em>borrar tu cuenta</em>. Al borrar tu cuenta se borran tus datos de la web; tu repo de GitHub es tuyo."
priv.h6: "6. Cambios a este aviso"
priv.c: "Si cambia, te lo mostramos y te pedimos aceptar la nueva versión. La versión vigente está arriba."
priv.h7: "7. Importante"
priv.i: "<strong>Esto no es consejo médico.</strong> Si algo duele, para. Consulta a un profesional de la salud ante cualquier duda.\nDatos de Garmin."
bv.titulo_pagina: "Bienvenida · Ahí la Llevas"
bv.titulo: "Vamos a armar tu plan"
bv.paso: "Paso {n} de {total}"
bv.p1_t: "Tu privacidad primero"
bv.p1_a: "Para armar tu plan guardamos datos de tu Garmin: <strong>frecuencia cardiaca, variabilidad (HRV), sueño y\n  composición corporal</strong>. Son <strong>datos personales sensibles</strong> y necesitamos tu consentimiento expreso."
bv.p1_l1: "Los usamos solo para mostrarte tu dashboard y tu plan (y compartirlos con tu coach si tú lo activas)."
bv.p1_l2: "No los vendemos ni los transferimos. Puedes descargarlos o borrarlos cuando quieras."
bv.p1_l3: "Tu key de Garmin <strong>nunca</strong> llega aquí: se queda en tu cuenta de GitHub."
bv.p1_l4: "Esto no es consejo médico. Si algo duele, para."
bv.p1_leer: "<a href=\"/privacidad\" target=\"_blank\" rel=\"noopener\">Leer el aviso de privacidad completo</a> (versión {v})."
bv.acepto: "Leí el aviso de privacidad y <strong>acepto expresamente</strong> el tratamiento de mis datos sensibles de salud para estas finalidades."
bv.continuar: "Continuar"
bv.p2_t: "¿Cuál es tu usuario de GitHub?"
bv.p2_a: "Tus datos de Garmin viajan por una copia privada que vive en <strong>tu</strong> cuenta de GitHub; así tu key\nnunca sale de ahí. Es gratis."
