bv.p2_sin: "¿No tienes cuenta? <a href=\"https://github.com/signup\" target=\"_blank\" rel=\"noopener\">Crea una gratis</a>\n(la usamos solo para correr tu copia del programa que baja tus datos)."
bv.p3_t: "Crea tu copia en GitHub"
bv.p3_a: "Se crea una copia <strong>privada</strong> del programa que baja tus datos de Garmin. Deja el nombre que te sugiere GitHub."
bv.p3_boton: "Crear mi copia en GitHub"
bv.p3_n: "En GitHub toca «Create repository from template». Luego regresa aquí."
bv.otro_nombre: "Si le pusiste otro nombre, abre tu repo en GitHub y sigue igual."
