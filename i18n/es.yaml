motor.ayuda.mej.titulo: "Cómo medimos tu mejora"
motor.ayuda.mej.ritmo_t: "Ritmo a {fc} lpm"
motor.ayuda.mej.ritmo: "llevamos el ritmo de cada corrida al aire libre a {fc} lpm (la mitad de tu Z2): ritmo × FC que llevaste ÷ {fc}. Es tu eficiencia aeróbica: si mejoras, a la misma FC vas más rápido. Solo cuentan corridas cuyo trote cayó en Z2; no carreras ni caminadora"
motor.ayuda.mej.ritmo_cal: ", ni las sesiones de calidad"
motor.ayuda.mej.ritmo_fin: ". El calor y el cansancio suben la FC: mira la tendencia, no una corrida suelta. En Progreso ves el promedio de tus últimas 4 corridas válidas contra tus semanas 1–2."
motor.ayuda.mej.deriva_t: "Deriva cardiaca"
motor.ayuda.mej.deriva: "en corridas de 40 min o más, casi sin caminar, a ritmo parejo y con al menos 80 % del trote en Z2, comparamos velocidad ÷ FC de la primera mitad contra la segunda (sin los primeros 10 min). Menos de 5 % de caída es buena base aeróbica; más, aún te falta base."
motor.ayuda.mej.trote_t: "% de trote"
motor.ayuda.mej.trote: "qué parte de la corrida fue trote: si sube, tu cuerpo ya aguanta trotar más tiempo seguido."
motor.ayuda.mej.esfuerzo_t: "Esfuerzo"
motor.ayuda.mej.esfuerzo: "calculado con tu FC, de 1 a 10 (Z2 = 3, Z3 = 5.5, Z4 = 7.5, Z5 = 9.5): el promedio de la mitad más dura de la sesión. Carga = esfuerzo × minutos; la fuerza con la FC baja da poca carga. El RPE que pones en el reloj se guarda aparte."
motor.ayuda.zon.titulo: "Tus zonas y el 80/20"
motor.ayuda.zon.p1: "Las zonas usan Karvonen (% de tu reserva de FC) con tu FC máx de {max} lpm. Se ajustan solas con tu FC en reposo."
motor.ayuda.zon.p2: "El 80/20: lo ideal es que al menos 80 % de tu tiempo en zonas sea suave (Z1–Z2), lo menos posible en Z3 y el resto fuerte (Z4–Z5). Incluye {lista}. Es solo referencia: no cambia tu plan."
