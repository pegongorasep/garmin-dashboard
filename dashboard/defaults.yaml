# Valores por defecto del motor. Se pueden sobreescribir en config.yaml (sección `umbrales:`).
umbrales:
  zone_pcts: [50, 60, 70, 80, 90]   # pisos de Z1..Z5 como % de la reserva de FC (Karvonen)
  done_ratio: 0.7                   # una sesión cuenta como hecha con >= 70 % de sus minutos
  ceiling_tolerance_min: 2          # minutos tolerados sobre el techo de Z2
  rhr_tolerance_bpm: 4              # FC en reposo: cuántos lpm sobre su promedio de 7 días
  sleep_min_hours: 6.5
  esfuerzo_duro: 8                  # esfuerzo (1–10) desde el cual el día de ayer cuenta como duro
  resumen_min_sesiones: 2           # resumen de la semana pasada: con menos sesiones hechas se sugiere repetirla
  resumen_dias_rojos: 2             # ... o con tantos días rojos
  resumen_carga_alta: 1.3           # ... y con más de este múltiplo de la carga anterior, "semana pesada"
  max_hr_review_above: 200          # avisar si la FC máx medida pasa de aquí
  run_types: [running, treadmill_running, trail_running, track_running]

# Sin plan de running (solo ver cómo va). Se pone en la raíz de config.yaml: `sin_plan: true`. Por defecto, con plan.
sin_plan: false

# Categorías para quien no defina `actividades.categorias`. `walking` y lo no listado no se muestran.
categorias:
  - {id: fuerza, nombre: Fuerza, letra: F, tipos: [strength_training], intensa: false}
  - {id: hiit, nombre: HIIT, letra: H, tipos: [hiit], intensa: true}
  - id: cardio
    nombre: Cardio
    letra: B
    tipos: [cycling, indoor_cycling, road_biking, mountain_biking, lap_swimming,
            open_water_swimming, indoor_rowing, rowing, elliptical, stair_climbing]
    intensa: false
  - {id: movilidad, nombre: Movilidad, letra: M, tipos: [yoga, pilates], intensa: false}
