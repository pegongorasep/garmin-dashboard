{% extends "base.html" %}
{% from "componentes.html" import boton %}
{% block titulo %}{{ t("salir.titulo_pagina") }}{% endblock %}
{% block contenido %}
<h1 class="pag-t">{{ t("salir.titulo") }}</h1>
<form class="pila" method="post" action="/salir">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="acciones">
    {{ boton(t("salir.cerrar"), tipo="submit") }}
    {{ boton(t("comun.cancelar"), "sec", href="/") }}
  </div>
</form>
{% endblock %}
