{% extends "base.html" %}
{% block titulo %}Entrar · Ahí la Llevas{% endblock %}
{% block contenido %}
{% if no_valida %}
<h1>Liga vencida</h1>
<p class="error">Esta liga ya se usó o venció.</p>
<p><a class="btn" href="/entrar">Pedir otra liga</a></p>
{% else %}
<h1>Entrar</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="btn" type="submit">Entrar a Ahí la Llevas</button>
</form>
{% endif %}
{% endblock %}
