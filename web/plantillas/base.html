<!doctype html>
<html lang="{{ idioma }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<script>
(function () {
  var t = "dark";
  try { var g = localStorage.getItem("tema"); if (g === "light" || g === "dark") t = g; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<title>{% block titulo %}{{ t("base.titulo") }}{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111a24">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/componentes.css">
<link rel="stylesheet" href="/estaticos/paginas.css">
</head>
<body class="pagina">
{% from "componentes.html" import pie %}
<main class="caja {% block clase %}{% endblock %}">
{% block contenido %}{% endblock %}
</main>
<div class="caja {% block clase_pie %}{% endblock %}">{{ pie(t, idioma, csrf, request.url.path) }}</div>
<script src="/actualizar.js" data-texto="{{ t('sitio.version_nueva') }}" data-accion="{{ t('sitio.version_actualizar') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
