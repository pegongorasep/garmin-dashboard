<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<script src="tema.js"></script>
<title>Sistema de diseño · Ahí la Llevas</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="componentes.css">
<style>
  body { padding-inline: 16px; padding-block: 8px 48px; }
  main { max-width: 720px; margin-inline: auto; display: grid; gap: var(--space-24); }
  .cat-top { display: flex; align-items: center; gap: var(--space-8); max-width: 720px; margin-inline: auto; padding-block: var(--space-8); }
  .cat-top h1 { flex: 1; margin: 0; font: 600 19px/24px var(--font-sans); }
  h2.grupo { margin: var(--space-16) 0 0; font: 600 11px/14px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .comp { display: grid; gap: var(--space-8); min-width: 0; }
  .comp > h3 { margin: 0; font: 600 15px/20px var(--font-sans); }
  .comp > h3 code { margin-left: var(--space-8); font: 400 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .comp > .que { margin: 0; color: var(--ink-2); font-size: 12.5px; line-height: 17px; }
  .muestra { display: grid; gap: var(--space-12); min-width: 0; align-content: start; }
</style>
</head>
<body>
<div class="cat-top" id="cat-top"></div>
<main id="catalogo" aria-live="polite"></main>

<script src="base.js"></script>
<script src="iconos.js"></script>
<script src="charts.js"></script>
<script src="componentes.js"></script>
<script src="arte.js"></script>
<script type="module" src="catalogo.js"></script>
</body>
</html>
