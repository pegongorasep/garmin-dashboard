/* Tema antes de pintar: el mismo que guarda la app (localStorage "tema"), oscuro por defecto. */
(function () {
  var t = "dark";
  try { var g = localStorage.getItem("tema"); if (g === "light" || g === "dark") t = g; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
  document.querySelector('meta[name="color-scheme"]').setAttribute("content", t);
})();
</script>

/* Catálogo: cada componente de componentes.js con datos de ejemplo. Aquí no hay lógica: solo se llaman las mismas
   funciones que usa la app (DS.*). Los textos y números son inventados. */

// --- tema claro / oscuro (data-theme en <html>, igual que la app) ---
function ponerTema(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.querySelector('meta[name="color-scheme"]').setAttribute("content", t);
  try { localStorage.setItem("tema", t); } catch (e) { /* sin almacenamiento: vale solo esta visita */ }
  pintarTop();
}
function pintarTop() {
  const claro = document.documentElement.getAttribute("data-theme") === "light";
  document.getElementById("cat-top").replaceChildren(
    h("h1", {}, "Sistema de diseño"),
    DS.botonIco(claro ? "luna" : "sol", `Cambiar a tema ${claro ? "oscuro" : "claro"}`, { onclick: () => ponerTema(claro ? "dark" : "light") }));
}
pintarTop();

    DS.diaCal({ nombre: "jue", numero: 26, numeroEnMarca: true, titulo: "jueves 26 nov: corrida incompleta", hijos: [h("span", { class: "circ incompleta" }, "26")] }),
    DS.diaCal({ nombre: "vie", numero: 27, titulo: "viernes 27 nov: sin actividad" }),
    DS.diaCal({ nombre: "sáb", numero: 28, titulo: "sábado 28 nov: sin actividad" }),
    DS.diaCal({ nombre: "dom", numero: 29, titulo: "domingo 29 nov: sin actividad" })),
  h("p", { class: "nota" }, "número = esfuerzo calculado con tu FC (1–10)")));
def("Datos", "Números", "DS.tiles() · DS.tile()", "Cuadros de número con su cambio contra el periodo anterior.",
  DS.tiles({ etiqueta: "Números de las últimas 8 semanas" },
    DS.tile({ k: "Minutos por semana", valor: "50", unidad: "min", delta: "▲ 46 min vs periodo anterior" }),
    DS.tile({ k: "Km por semana", valor: "5.9", unidad: "km", delta: "= igual que el periodo anterior", deltaClase: "neutro" }),
    DS.tile({ k: "Ritmo a 144 lpm", valor: "7:42", unidad: "/km", delta: "▼ 5 s vs inicio", deltaClase: "mal" }),
    DS.tile({ k: "% trote", valor: "71", unidad: "%", delta: "Sin periodo anterior", deltaClase: "neutro" })));
const distEj = { minutos: { Z1: 12, Z2: 70, Z3: 11, Z4: 18, Z5: 0 }, bajo: 73, limbo: 10, alto: 17 };
def("Datos", "Barra de zonas", "DS.barraZonas()", "Minutos por zona con la meta de 80 % bajo; la compacta lleva el % dentro de cada tramo.",
  DS.tarjeta({ titulo: "Intensidad de la semana" }, DS.barraZonas(distEj)),
  DS.tarjeta({ titulo: "Esta semana" }, DS.barraZonas(distEj, { compacta: true, etiquetas: true }), h("p", { class: "nota" }, "Bajo 73 % · meta 80 %")));
def("Navegación", "Pestañas inferiores", "DS.tabs()", "La barra de abajo de la app (aquí sin fijar a la pantalla).",
  h("div", { style: "position:relative" }, DS.tabs({ actual: "plan", items: [{ id: "hoy", texto: "Hoy", icono: "hoy", href: "#" }, { id: "plan", texto: "Plan", icono: "plan", href: "#" }, { id: "progreso", texto: "Progreso", icono: "progreso", href: "#" }] })));

// Gráficas
const una = [[20, "Z2"]];
const piramide = [[1, "Z4"], [1, "Z2"], [2, "Z4"], [1, "Z2"], [3, "Z4"], [2, "Z2"], [2, "Z4"], [1, "Z2"], [1, "Z4"], [4, "Z2"]];
const muchos = [[8, "Z2"], ...rep(10, [1, "Z5"], [1, "Z1"]), [3, "Z2"], ...rep(4, [3, "Z4"], [2, "Z2"]), [6, "Z2", true]];
def("Gráficas", "Silueta · una zona", "DS.silueta()", "Una sola zona: etiquetas completas con minutos, zona y lpm.",
  DS.tarjeta({ titulo: "Silueta · una zona" }, DS.silueta(una, { rachas: rachasDe(una) })));
def("Gráficas", "Silueta · pirámide", "DS.silueta()", "Varios tramos distintos: solo los minutos, con una guía del color del tramo. Si dos etiquetas chocan, una sube de nivel.",
  DS.tarjeta({ titulo: "Silueta · pirámide" }, DS.silueta(piramide, { rachas: rachasDe(piramide) }), leyendaZonas(piramide)));
def("Gráficas", "Silueta · muchos intervalos", "DS.silueta()", "Las repeticiones se juntan en un corchete: «10 × 1′ Z5 + 1′ Z1». Toca un tramo para ver sus lpm. Punteado = opcional.",
  DS.tarjeta({ titulo: "Silueta · muchos intervalos" }, DS.silueta(muchos, { rachas: rachasDe(muchos) }), leyendaZonas(muchos)));
const trote = [22, 24, 26, 20, 28, 30, 32, 34], camina = [10, 9, 8, 10, 7, 6, 6, 5];
def("Gráficas", "Barras apiladas · trote y caminata", "DS.graficaBarras()", "Minutos de trote y de caminata por semana, con la meta del plan en cada barra.",
  DS.tarjeta({ titulo: "Trote y caminata por semana" }, DS.leyenda([["var(--serie-1)", "Trote"], ["var(--caminata)", "Caminata"]]),
    DS.graficaBarras({ alto: 170, clases: ["s1", "walk"], etiquetaFinal: "39 min", etiqueta: "Minutos de trote y caminata por semana",
      semanas: trote.map((t, i) => ({ inicio: fechaIso(semana(i, new Date(2026, 9, 5))), valores: [t, camina[i]], meta: 36 + i })),
      texto: (s) => `Semana del ${fmt(parseFecha(s.inicio).getDate(), 0)} ${MESES[parseFecha(s.inicio).getMonth()]}\nTrote ${s.valores[0]} min\nCaminata ${s.valores[1]} min\nMeta ${s.meta} min` })));
const fc = [58, 57, 57, 56, null, 55, 55, 54, 54, 53, 54, 52];
def("Gráficas", "Línea con cruz", "DS.graficaLinea()", "Tendencia con el último punto marcado. Toca o recorre con las flechas para ver cada semana; el hueco es una semana sin dato.",
  DS.tarjeta({ titulo: "FC en reposo" }, DS.graficaLinea({ alto: 160, etiqueta: "FC en reposo por semana", etiquetaFinal: "52",
    serie: fc.map((y, i) => ({ fecha: fechaIso(semana(i)), y })), fmtY: (v) => fmt(v, 0),
    texto: (p) => `Semana del ${fmt(parseFecha(p.fecha).getDate(), 0)} ${MESES[parseFecha(p.fecha).getMonth()]}\n${p.y} lpm` })));

const raiz = document.getElementById("catalogo");
for (const [grupo, secciones] of Object.entries(GRUPOS)) raiz.append(h("h2", { class: "grupo" }, grupo), ...secciones);
</script>
