<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<script>
/* Tema antes de pintar: lo guardado, o oscuro por defecto. ?tema=claro|oscuro fuerza uno solo para capturas (no se guarda). */
(function () {
  var t = "dark";
  try {
    var q = /[?&]tema=(claro|oscuro)/.exec(location.search);
    var g = localStorage.getItem("tema");
    if (q) t = q[1] === "claro" ? "light" : "dark"; else if (g === "light" || g === "dark") t = g;
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
  document.querySelector('meta[name="color-scheme"]').setAttribute("content", t);
})();
</script>
<title>Garmin · Mi entreno</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-fila">
    <h1 id="titulo">Mi entreno</h1>
    <div class="top-btns">
    <button type="button" id="ayuda-btn" class="tema-btn" aria-label="Ayuda" hidden><span aria-hidden="true">?</span></button>
    <button type="button" id="tema-btn" class="tema-btn" aria-label="Cambiar a tema claro"><span aria-hidden="true">☀</span></button>
    </div>
  </div>
  <p class="muted"><span id="actualizado" aria-live="polite">Cargando…</span><span id="acciones" hidden> ·
    <a id="acciones-link" href="#" target="_blank" rel="noopener"
       title="En GitHub toca «Run workflow»; en 1–2 min recarga esta página">Jalar datos de Garmin ↗</a></span></p>
  <nav id="menu-web" class="menu-web" aria-label="Cuenta" hidden></nav>
</header>

<main id="app">
  <section id="vista-hoy" class="vista" hidden></section>
  <section id="vista-plan" class="vista" hidden></section>
  <section id="vista-progreso" class="vista" hidden></section>
  <section id="vista-ayuda" class="vista" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones">
  <a href="#hoy" data-tab="hoy"><span class="ico" aria-hidden="true">●</span>Hoy</a>
  <a href="#plan" data-tab="plan"><span class="ico" aria-hidden="true">≡</span>Plan</a>
  <a href="#progreso" data-tab="progreso"><span class="ico" aria-hidden="true">↗</span>Progreso</a>
</nav>

<script src="charts.js"></script>
<script src="iconos.js"></script>
<script src="app.js"></script>
<script src="vistas.js"></script>
</body>
</html>
