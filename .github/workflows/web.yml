name: Web

# Despliegue manual de la web (Ahí la Llevas) a Google Cloud Run: pruebas e imagen a la vez -> `gcloud run deploy`.
# Entra a Google con Workload Identity Federation (sin llaves JSON). Variables del repo (no secretos):
# GCP_PROYECTO, GCP_PROVEEDOR_WIF, GCP_CUENTA_SERVICIO, ADMIN_CORREO (opcional: contacto del aviso de privacidad).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-central1
  SERVICIO: ahi-la-llevas
  REPOSITORIO: web   # repo de Artifact Registry

jobs:
  # Dos máquinas a la vez: las pruebas de la web y el resto (entre las dos son todas las de tests/)
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { grupo: web, rutas: "tests/test_web_*.py" }
          - { grupo: resto, rutas: "tests --ignore-glob=tests/test_web_*.py" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r web/requirements.txt -r requirements-dev.txt
      - run: pip-audit -r requirements.txt -r web/requirements.txt
        if: matrix.grupo == 'web'
      - run: ruff check .
      - run: python -m pytest -q -n auto --dist worksteal ${{ matrix.rutas }}

  # Se construye mientras corren las pruebas; solo se publica si todo pasa (job desplegar)
  imagen:
    if: github.repository == 'pegongorasep/garmin-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_PROVEEDOR_WIF }}
          service_account: ${{ vars.GCP_CUENTA_SERVICIO }}

      # gcloud ya viene en ubuntu-latest y toma las credenciales que deja el paso `auth`
      - name: Nombre de la imagen y acceso a Artifact Registry
        run: |
          IMAGEN="${REGION}-docker.pkg.dev/${{ vars.GCP_PROYECTO }}/${REPOSITORIO}/${SERVICIO}:${GITHUB_SHA}"
          echo "IMAGEN=${IMAGEN}" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      # Caché de capas en GitHub Actions: si no cambian los requirements ni la imagen base, no se repite el pip install.
      # El repo es público: nada de build-args ni secretos en la imagen (el Dockerfile copia solo carpetas de código).
      - name: Construir y subir la imagen
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGEN }}
          provenance: false   # un manifiesto simple para Cloud Run
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  desplegar:
    needs: [pruebas, imagen]
    if: github.repository == 'pegongorasep/garmin-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_PROVEEDOR_WIF }}
          service_account: ${{ vars.GCP_CUENTA_SERVICIO }}

      - name: Desplegar en Cloud Run
        run: |
          IMAGEN="${REGION}-docker.pkg.dev/${{ vars.GCP_PROYECTO }}/${REPOSITORIO}/${SERVICIO}:${GITHUB_SHA}"
          echo "IMAGEN=${IMAGEN}" >> "$GITHUB_ENV"
          # Entrar con Google: solo si existe la variable del repo GOOGLE_CLIENT_ID (el secreto vive en Secret Manager)
          SECRETOS="SECRET_KEY=SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest"
          VARS="BASE_URL=https://ahilallevas.com,ADMIN_CORREO=${{ vars.ADMIN_CORREO }}"
          # GitHub App (conexión con Garmin y botón Sincronizar): sus 5 valores viven en Secret Manager
          for s in ID SLUG CLIENT_ID CLIENT_SECRET PRIVATE_KEY; do SECRETOS="${SECRETOS},GITHUB_APP_${s}=GITHUB_APP_${s}:latest"; done
          if [ -n "${{ vars.GOOGLE_CLIENT_ID }}" ]; then
            SECRETOS="${SECRETOS},GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest"
            VARS="${VARS},GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
          fi
          gcloud run deploy "${SERVICIO}" \
            --project "${{ vars.GCP_PROYECTO }}" --region "${REGION}" --image "${IMAGEN}" \
            --min-instances 0 --max-instances 1 --memory 512Mi \
            --service-account "servidor-web@${{ vars.GCP_PROYECTO }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --set-secrets "${SECRETOS}" \
            --set-env-vars "${VARS}"

      # Comandos de admin (invitar, crear-admin): un Cloud Run Job con la misma imagen y los mismos secretos, para que
      # nadie copie la cadena de la base a su compu. Uso: gcloud run jobs execute ahi-cli --args="-m,web.cli,invitar,--nota,Adrián" (el Job ya trae `--command python`)
      - name: Actualizar el Job de comandos de admin
        run: |
          gcloud run jobs deploy ahi-cli \
            --project "${{ vars.GCP_PROYECTO }}" --region "${REGION}" --image "${IMAGEN}" \
            --command python --args="-m,web.cli,--help" \
            --memory 512Mi --max-retries 0 \
            --service-account "servidor-web@${{ vars.GCP_PROYECTO }}.iam.gserviceaccount.com" \
            --set-secrets "SECRET_KEY=SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest" \
            --set-env-vars "BASE_URL=https://ahilallevas.com"
