name: Motor

# Workflow reutilizable: baja los datos de Garmin de quien lo llama, construye el sitio con el código
# del motor (etiqueta `stable` salvo que se pida otra) y lo publica en GitHub Pages del que llama.
on:
  workflow_call:
    inputs:
      motor_ref:
        description: Etiqueta, rama o commit del motor (pegongorasep/garmin-dashboard)
        type: string
        default: stable
    secrets:
      PERSONAL_API_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
    env:
      # La web de Ahí la Llevas (v5). Si no responde, todo sigue como antes: nunca falla el workflow por ella.
      AHILALLEVAS_URL: https://ahilallevas.com
    permissions:
      contents: write   # para dejar al día CLAUDE.md y .claude/skills en repos de amigos
      pages: write      # actions/configure-pages
      id-token: write
    steps:
      # 1. El repo de quien llama, en la raíz: es el directorio de usuario (config.yaml, plan/, data/).
      - uses: actions/checkout@v4

      # 2. El código del motor.
      - uses: actions/checkout@v4
        with:
          repository: pegongorasep/garmin-dashboard
          ref: ${{ inputs.motor_ref }}
          path: motor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt

      - run: pip install -r motor/requirements.txt

      # Caché del RPE por actividad: cada corrida guarda una versión nueva.
      - uses: actions/cache@v4
        with:
          path: data/activity_details.json
          key: activity-details-${{ github.run_id }}
          restore-keys: activity-details-

      # 3. Instrucciones de la web (qué tanto historial bajar). Sin respuesta: los argumentos de siempre (vacío).
      - name: Pedir instrucciones a la web
        id: instrucciones
        run: echo "args=$(python motor/scripts/subir.py instrucciones || true)" >> "$GITHUB_OUTPUT"

      - name: Bajar datos de Garmin
        run: python motor/garmin_connect.py ${{ steps.instrucciones.outputs.args }}
        env:
          PERSONAL_API_KEY: ${{ secrets.PERSONAL_API_KEY }}
          GARMIN_USER_DIR: ${{ github.workspace }}

      # 4. Mandar el paquete limpio (lista blanca) a la web. `publicar_pages=false` cuando la persona ya migró.
      - name: Subir datos a la web
        id: subida
        run: python motor/scripts/subir.py subir || echo "publicar_pages=true" >> "$GITHUB_OUTPUT"
        env:
          GARMIN_USER_DIR: ${{ github.workspace }}

      # 5. Sin config.yaml (repo nuevo que solo es tubo de datos) o ya migrado: no se construye ni se publica Pages.
      - name: Decidir si se publica Pages
        id: decidir
        run: |
          if [ -f config.yaml ] && [ "${{ steps.subida.outputs.publicar_pages }}" != "false" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir el sitio
        if: steps.decidir.outputs.publicar == 'true'
        run: python motor/dashboard/build.py
        env:
          GARMIN_USER_DIR: ${{ github.workspace }}

      - name: Validar data.json (lista blanca de privacidad)
        if: steps.decidir.outputs.publicar == 'true'
        run: python motor/dashboard/validar.py

      - uses: actions/configure-pages@v5
        if: steps.decidir.outputs.publicar == 'true'

      - name: Quitar el catálogo de diseño (no se publica en ninguna Pages; solo en /diseno de la web y en local)
        if: steps.decidir.outputs.publicar == 'true'
        run: rm -f motor/site/catalogo.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.decidir.outputs.publicar == 'true'
        with:
          path: motor/site

      # Solo en repos de amigos: CLAUDE.md y las skills se copian del motor. No toca .github/workflows/.
      # Ya migrados (publicar_pages=false) o sin config.yaml: `decidir.publicar` es false y este paso se salta.
      # Si el push choca (la persona subió algo a la vez), no frena la publicación: se reintenta en la próxima.
      - name: Dejar al día las instrucciones de Claude
        if: github.repository != 'pegongorasep/garmin-dashboard' && steps.decidir.outputs.publicar == 'true'
        continue-on-error: true
        run: |
          cp motor/template/CLAUDE.md CLAUDE.md
          rm -rf .claude/skills
          mkdir -p .claude
          cp -r motor/template/.claude/skills .claude/skills
          if [ -n "$(git status --porcelain -- CLAUDE.md .claude/skills)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CLAUDE.md .claude/skills
            git commit -m "chore: instrucciones al día (motor $(git -C motor rev-parse --short HEAD))"
            git pull --rebase && git push
          fi

  deploy:
    needs: build
    if: needs.build.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
