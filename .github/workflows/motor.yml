name: Motor

# Workflow reutilizable: el tubo de datos. Baja los datos de Garmin de quien lo llama y los sube a la web de
# Ahí la Llevas (código del motor en la etiqueta `stable` salvo que se pida otra). No publica ningún sitio.
on:
  workflow_call:
    inputs:
      motor_ref:
        description: Etiqueta, rama o commit del motor (pegongorasep/garmin-dashboard)
        type: string
        default: stable
    secrets:
      PERSONAL_API_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # La web de Ahí la Llevas. Si la subida falla, el job falla (se ve en rojo); si el repo aún no está vinculado, solo avisa.
      AHILALLEVAS_URL: https://ahilallevas.com
    permissions:
      contents: read
      id-token: write   # token OIDC para hablar con la web
    steps:
      # 1. El repo de quien llama, en la raíz: es el directorio de usuario (config.yaml, plan/, data/).
      - uses: actions/checkout@v7

      # 2. El código del motor.
      - uses: actions/checkout@v7
        with:
          repository: pegongorasep/garmin-dashboard
          ref: ${{ inputs.motor_ref }}
          path: motor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt

      - run: pip install -r motor/requirements.txt

      - name: Avisar a la web
        run: python motor/scripts/subir.py avance arranca || true
        env:
          GARMIN_USER_DIR: ${{ github.workspace }}

      # Caché del RPE por actividad: cada corrida guarda una versión nueva.
      - uses: actions/cache@v4
        with:
          path: data/activity_details.json
          key: activity-details-${{ github.run_id }}
          restore-keys: activity-details-

      # 3. Instrucciones de la web (qué tanto historial bajar). Sin respuesta: los argumentos de siempre (vacío).
      - name: Pedir instrucciones a la web
        id: instrucciones
        run: echo "args=$(python motor/scripts/subir.py instrucciones || true)" >> "$GITHUB_OUTPUT"

      - name: Bajar datos de Garmin
        run: python motor/scripts/subir.py bajar ${{ steps.instrucciones.outputs.args }}
        env:
          PERSONAL_API_KEY: ${{ secrets.PERSONAL_API_KEY }}
          GARMIN_USER_DIR: ${{ github.workspace }}

      # 4. Mandar el paquete limpio (lista blanca) a la web. Falla si la subida falla; "no vinculado" no es fallo.
      - name: Subir datos a la web
        run: |
          python motor/scripts/subir.py avance sube || true
          python motor/scripts/subir.py subir
        env:
          GARMIN_USER_DIR: ${{ github.workspace }}

      # Si algo falló y nadie avisó el motivo, la web se entera de que fue «otra».
      - name: Avisar el fallo a la web
        if: failure()
        run: python motor/scripts/subir.py fallo || true
        env:
          GARMIN_USER_DIR: ${{ github.workspace }}
