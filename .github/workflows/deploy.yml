name: Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"  # 7:00 Mérida
    - cron: "0 19 * * *"  # 13:00 Mérida
    - cron: "0 1 * * *"   # 19:00 Mérida

# El grupo vive aquí (no en motor.yml): con el mismo nombre en los dos, el flujo se bloquea a sí mismo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pedro prueba el motor antes de publicar: si pytest falla, no se publica.
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  publicar:
    needs: pruebas
    uses: ./.github/workflows/motor.yml
    with:
      motor_ref: ${{ github.sha }}
    secrets:
      PERSONAL_API_KEY: ${{ secrets.PERSONAL_API_KEY }}
    permissions:
      contents: write
      pages: write
      id-token: write
