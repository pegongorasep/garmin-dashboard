name: Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"  # 7:00 Mérida
    - cron: "0 19 * * *"  # 13:00 Mérida
    - cron: "0 1 * * *"   # 19:00 Mérida

# El grupo vive aquí (no en motor.yml): con el mismo nombre en los dos, el flujo se bloquea a sí mismo.
concurrency:
  group: tubo
  cancel-in-progress: false

jobs:
  # Las pruebas corren en web.yml (antes de cada despliegue); aquí el tubo de datos no las repite.
  publicar:
    uses: ./.github/workflows/motor.yml
    with:
      motor_ref: ${{ github.sha }}
    secrets:
      PERSONAL_API_KEY: ${{ secrets.PERSONAL_API_KEY }}
    permissions:
      contents: read
      id-token: write
