version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      raiz:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
